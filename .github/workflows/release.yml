name: Publish test app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  payload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build app.zip and manifest.json
        run: node script/pack-app.mjs

      - name: Publish test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view test || gh release create test --title "test" --notes "Zenlecs test app channel"
          gh release upload test dist/test/app.zip dist/test/manifest.json --clobber
